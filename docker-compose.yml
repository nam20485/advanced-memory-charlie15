version: '3.8'

services:
  neo4j:
    image: neo4j:5.18
    container_name: advanced-memory-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - advanced-memory-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: advanced-memory-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - advanced-memory-network

  graphrag-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.GraphRAGService
    container_name: advanced-memory-graphrag
    ports:
      - "50051:50051"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
    depends_on:
      - neo4j
      - qdrant
    networks:
      - advanced-memory-network

  mem0-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.Mem0Service
    container_name: advanced-memory-mem0
    ports:
      - "50052:50052"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - neo4j
      - qdrant
    networks:
      - advanced-memory-network

  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.McpServer
    container_name: advanced-memory-mcp-server
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - GRAPHRAG_SERVICE_URL=graphrag-service:50051
      - MEM0_SERVICE_URL=mem0-service:50052
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - graphrag-service
      - mem0-service
    networks:
      - advanced-memory-network

  blazor-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.BlazorApp
    container_name: advanced-memory-ui
    ports:
      - "5000:5000"
    environment:
      - MCP_SERVER_URL=http://mcp-server:8080
    depends_on:
      - mcp-server
    networks:
      - advanced-memory-network

volumes:
  neo4j-data:
  neo4j-logs:
  qdrant-storage:

networks:
  advanced-memory-network:
    driver: bridge
